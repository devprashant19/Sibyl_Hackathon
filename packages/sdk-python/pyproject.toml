[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sibyl-sdk"
version = "0.1.0"
description = "Sibyl Simulation & Fault Injection SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "httpx",
    "psycopg2-binary",
    "asyncpg"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "fastapi",
    "uvicorn",
    "sqlalchemy"
]
