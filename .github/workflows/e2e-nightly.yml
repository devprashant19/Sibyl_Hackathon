name: Playwright E2E Nightly

on:
  schedule:
    - cron: '0 0 * * *' # Run nightly at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @sibyl/e2e exec playwright install --with-deps chromium

      # No containers: packages/e2e/playwright.config.ts starts the API (in-memory store) and the
      # dashboard (next build + next start, because CI=true), and its globalSetup seeds the API by
      # running the real CLI (`sibyl ci`) on the quickstart config.
      - name: Run Playwright tests
        run: pnpm --filter @sibyl/e2e test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 30
