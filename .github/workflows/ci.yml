name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight

jobs:
  build:
    name: Build, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Turbo affected-only

      # pnpm version comes from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # The unit suites and the ESM setup are tested on Node 22.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit tests run below with coverage, so they are not repeated here.
      - name: Build and lint (affected only on PRs)
        if: github.event_name == 'pull_request'
        run: pnpm turbo run build lint --filter="...[origin/main]"

      - name: Build and lint (all on main)
        if: github.event_name == 'push'
        run: pnpm turbo run build lint

      # Each package runs its own vitest with its own vitest.config (and coverage thresholds, e.g.
      # 85% lines for core, 70% for agent). Running vitest once at the root would use
      # vitest.workspace.ts instead, which ignores per-package thresholds and picks up the
      # Playwright spec in packages/e2e. `./packages/*` does not match packages/fault-drivers/*.
      - name: Unit tests with coverage (packages)
        run: pnpm -r --filter "./packages/*" --filter "!@sibyl/e2e" run --if-present test --coverage

      # The fault drivers share packages/fault-drivers/vitest.config.ts (85% lines, integration
      # tests excluded); a driver's own `vitest run` would not see that config.
      - name: Unit tests with coverage (fault drivers)
        run: pnpm exec vitest run --coverage --root packages/fault-drivers

      # Real API + real CLI + real fault injection: search, upload, SSE, replay.
      - name: End-to-end smoke test
        run: node scripts/smoke.mjs

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only packages with a `test:integration` script run: @sibyl-fault-drivers/db and
      # @sibyl-fault-drivers/mq (Testcontainers; Docker is available on ubuntu-latest).
      - name: Run Integration Tests
        run: pnpm turbo run test:integration
